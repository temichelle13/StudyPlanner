
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Study Planner</h1>
    </header>
    <main>
        <section id="schedule" aria-labelledby="schedule-heading">
            <h2 id="schedule-heading">Your Schedule</h2>
            <p>Keep track of upcoming study sessions and important deadlines.</p>
        </section>
        <section id="tasks" aria-labelledby="tasks-heading">
            <h2 id="tasks-heading">Your Tasks</h2>
            <p id="statusMessage" class="status" role="status" aria-live="polite" hidden></p>
            <form id="taskForm" class="task-form" novalidate>
                <div class="form-field">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" name="title" maxlength="100" required>
                </div>
                <div class="form-field">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" maxlength="500" rows="3"></textarea>
                </div>
                <div class="form-field">
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate" name="dueDate">
                </div>
                <div class="form-field">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority" name="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <button type="submit">Add Task</button>
            </form>
            <ul id="tasksList" class="tasks-list" aria-live="polite"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="currentYear"></span> Study Planner</p>
    </footer>
</body>
</html>
