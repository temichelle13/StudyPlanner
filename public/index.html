<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Study Planner</h1>
    <p>Organise your study schedule and keep track of upcoming tasks.</p>
  </header>
  <main>
    <section id="schedule">
      <h2>Your Schedule</h2>
      <p class="muted">Add your study blocks and reminders here.</p>
    </section>
    <section id="tasks">
      <h2>Your Tasks</h2>
      <div id="taskForm">
        <form id="taskFormElement" novalidate>
          <label for="taskTitle">Title</label>
          <input type="text" id="taskTitle" name="title" placeholder="Read chapter 5" required>

          <label for="taskDescription">Description</label>
          <textarea id="taskDescription" name="description" placeholder="Summarise the main concepts" required></textarea>

          <label for="taskDueDate">Due date</label>
          <input type="date" id="taskDueDate" name="dueDate" required>

          <button type="submit">Add Task</button>
        </form>
      </div>
      <div id="taskList" aria-live="polite"></div>
    </section>
  </main>
  <footer>
    <p>&copy; <span id="currentYear"></span> Study Planner</p>
  </footer>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
  <script src="main.js"></script>
</body>
</html>
